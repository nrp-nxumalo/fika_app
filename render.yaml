services:
  - type: cron
    name: fika-timetable-source-daily
    runtime: python
    # 01:17 UTC is 03:17 in Johannesburg.  The non-round minute avoids the
    # busiest cron boundary while keeping the check in a low-traffic window.
    schedule: "17 1 * * *"
    buildCommand: pip install -r requirements.txt && npm ci --omit=dev
    startCommand: python -m timetable_verification.check_sources
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TIMETABLE_REQUEST_INTERVAL_SECONDS
        value: "1.5"
      - key: TIMETABLE_REQUEST_JITTER_SECONDS
        value: "0.25"
      - key: TIMETABLE_AUDIT_SAMPLE_SIZE
        value: "200"
      - key: GABS_AUTO_APPROVE
        value: "1"

  - type: cron
    name: fika-gsc-weekly
    runtime: node
    schedule: "0 4 * * 1"
    buildCommand: npm ci
    startCommand: npm run sync:gsc
    envVars:
      - key: NODE_ENV
        value: production
      - key: GSC_SITE_URL
        value: https://www.fika.net.za/
      - key: DATABASE_URL
        sync: false
      - key: GSC_SERVICE_ACCOUNT_JSON
        sync: false
